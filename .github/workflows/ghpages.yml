# https://github.com/actions/deploy-pages#usage
name: Deploy Nuxt App to GitHub Pages
on:
    workflow_dispatch:
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            # nuxt's CLI shebang runs on Node, so keep it for the build itself
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-
            - run: bun install --frozen-lockfile
            # Drop the env var below if your GitHub Pages is configured for a custom domain
            - run: bun run build --preset github_pages
              env:
                  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./.output/public
    # Deployment job
    deploy:
        # Add a dependency to the build job
        needs: build
        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write      # to deploy to Pages
            id-token: write   # to verify the deployment originates from an appropriate source
        # Deploy to the github_pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        # Specify runner + deployment step
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
